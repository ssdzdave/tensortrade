[metadata]
description = An open source reinforcement learning framework for training, evaluating, and deploying robust trading agents.
long_description = file: README.md
long_description_content_type = text/markdown

[tool:pytest]
# Repo root on sys.path so tests import daily_signals/ without an editable
# install (CI's signals-light job installs only daily_signals/requirements.txt).
pythonpath = .
markers =
    slow: marks tests as slow (skip with -m 'not slow')
    rllib: marks RLlib integration tests (skip with -m 'not rllib')
