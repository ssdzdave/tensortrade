name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tests,signals]"

      - name: Run tests
        run: pytest tests/ -m "not rllib" --tb=short

  # Proof that the daily-signals pipeline runs WITHOUT tensortrade's heavy
  # dependencies (no tensorflow/ray/torch): install only its requirements.
  signals-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r daily_signals/requirements.txt pytest

      - name: Run daily-signals tests
        run: pytest tests/daily_signals -m "not rllib" --tb=short
