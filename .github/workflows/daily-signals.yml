name: Daily Signals

on:
  schedule:
    # 00:15 UTC — 15 minutes after the daily close so the closed bar is final
    - cron: "15 0 * * *"
  workflow_dispatch: {}

# One run at a time; a manual run while the cron is active would race the
# state commits.
concurrency:
  group: daily-signals
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily_signals/requirements.txt

      - name: Run the daily pipeline
        env:
          SIGNALS_SMTP_PASSWORD: ${{ secrets.SIGNALS_SMTP_PASSWORD }}
        run: |
          CONFIG=config/signals.yaml
          if [ ! -f "$CONFIG" ]; then
            echo "config/signals.yaml not found — using the example config (email disabled)"
            CONFIG=config/signals.example.yaml
          fi
          python -m daily_signals --config "$CONFIG" run-daily

      - name: Commit the audit trail (state + site)
        run: |
          git config user.name "daily-signals-bot"
          git config user.email "daily-signals-bot@users.noreply.github.com"
          for path in state reports/site; do
            [ -d "$path" ] && git add --all "$path"
          done
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily signals: $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload web report for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/site

  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
